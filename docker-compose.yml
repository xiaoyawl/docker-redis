services:
  redis:
    build:
      context: .
      args:
        BASE_IMAGE: benyoo/alpine:3.21.20260327
        REDIS_VERSION: 7.2.11
    image: docker-redis:7.2.11
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
      DEFAULT_CONF: enable
      # REDIS_PASS: auto
      # 仅在需要启用密码时取消注释：
      # REDIS_PASS: your_strong_password
      ENABLE_KERNEL_TUNING: auto
      DATA_DIR: /data/redis
      CONFIG_FILE: /etc/redis.conf
    volumes:
      - ./data:/data/redis
      - ./redis.conf:/etc/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASS}\" ]; then redis-cli -a \"$${REDIS_PASS}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s
    # 某些 Linux 场景可按需启用下列参数，而不必使用 privileged。
    # sysctls:
    #   net.core.somaxconn: "8192"
    #   vm.overcommit_memory: "1"
